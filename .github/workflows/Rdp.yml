
name: "SuzLab Tunnel - RDP Demo"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "SuzLab Tunnel Session Duration"
        required: true
        default: "3h"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

permissions:
  contents: read

jobs:
  suzlab-demo:
    name: "SuzLab SSH Reverse Tunnel"
    runs-on: windows-latest
    timeout-minutes: 340

    env:
      TUNNEL_HOST: tnl.suzlab.com
      TUNNEL_PORT: "2222"
      RDP_PORT: "3389"

    steps:
      # ==========================================
      # 01 - WELCOME
      # ==========================================

      - name: "01 - SuzLab Welcome"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          SUZLAB TUNNEL"
          Write-Host "          RDP DEMO SERVICE"
          Write-Host "======================================"
          Write-Host "Host: $env:TUNNEL_HOST"
          Write-Host "SSH Port: $env:TUNNEL_PORT"
          Write-Host "RDP Port: $env:RDP_PORT"
          Write-Host "Duration: ${{ inputs.duration }}"
          Write-Host "======================================"

      # ==========================================
      # 02 - WINDOWS RDP
      # ==========================================

      - name: "02 - Configure Windows RDP"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name SecurityLayer -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          $rdp = Get-Service TermService

          if ($rdp.Status -ne "Running") {
            throw "RDP service failed to start."
          }

          Write-Host "[OK] Windows RDP ready."

      # ==========================================
      # 03 - RDP ACCOUNT
      # ==========================================

      - name: "03 - Create SuzLab Demo Account"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower = "abcdefghijkmnpqrstuvwxyz"
          $digits = "23456789"
          $all = $upper + $lower + $digits

          $password = ""
          $password += $upper[(Get-Random -Maximum $upper.Length)]
          $password += $lower[(Get-Random -Maximum $lower.Length)]
          $password += $digits[(Get-Random -Maximum $digits.Length)]

          for ($i = 0; $i -lt 17; $i++) {
            $password += $all[(Get-Random -Maximum $all.Length)]
          }

          $password = -join ($password.ToCharArray() | Sort-Object { Get-Random })

          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          $old = Get-LocalUser -Name "SUZLAB-DEMO" -ErrorAction SilentlyContinue

          if ($old) {
            Remove-LocalUser -Name "SUZLAB-DEMO"
          }

          New-LocalUser `
            -Name "SUZLAB-DEMO" `
            -Password $secure `
            -Description "SuzLab Tunnel Demo" `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "SUZLAB-DEMO"

          "## SuzLab RDP Account" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Field | Value |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Username | SUZLAB-DEMO |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Password | $password |" | Out-File $env:GITHUB_STEP_SUMMARY -Append

          Write-Host "[OK] Demo account created."

      # ==========================================
      # 04 - OPENSSH
      # ==========================================

      - name: "04 - Install OpenSSH"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command ssh.exe -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability `
              -Online `
              -Name OpenSSH.Client~~~~0.0.1.0
          }

          if (-not (Get-Command ssh.exe -ErrorAction SilentlyContinue)) {
            throw "OpenSSH installation failed."
          }

          Write-Host "[OK] OpenSSH ready."

      # ==========================================
      # 05 - SSH ASKPASS
      # ==========================================

      - name: "05 - Prepare SuzLab Authentication"
        shell: pwsh
        env:
          SUZLAB_TUNNEL_USER: ${{ secrets.SUZLAB_TUNNEL_USER }}
          SUZLAB_TUNNEL_PASSWORD: ${{ secrets.SUZLAB_TUNNEL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SUZLAB_TUNNEL_USER)) {
            throw "Missing SUZLAB_TUNNEL_USER."
          }

          if ([string]::IsNullOrWhiteSpace($env:SUZLAB_TUNNEL_PASSWORD)) {
            throw "Missing SUZLAB_TUNNEL_PASSWORD."
          }

          $askpass = "$env:RUNNER_TEMP\suzlab-askpass.cmd"

          @'
          @echo off
          echo %SUZLAB_TUNNEL_PASSWORD%
          '@ | Set-Content $askpass -Encoding ASCII

          "SUZLAB_ASKPASS=$askpass" >> $env:GITHUB_ENV

          Write-Host "[OK] Authentication helper prepared."

      # ==========================================
      # 06 - CONNECT TUNNEL
      # ==========================================

      - name: "06 - Connect SuzLab Reverse Tunnel"
        shell: pwsh
        env:
          SUZLAB_TUNNEL_USER: ${{ secrets.SUZLAB_TUNNEL_USER }}
          SUZLAB_TUNNEL_PASSWORD: ${{ secrets.SUZLAB_TUNNEL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $log = "$env:RUNNER_TEMP\suzlab-ssh.log"

          $env:SSH_ASKPASS = $env:SUZLAB_ASKPASS
          $env:SSH_ASKPASS_REQUIRE = "force"
          $env:DISPLAY = "suzlab"

          $sshArgs = @(
            "-p", "2222",
            "-N",
            "-T",
            "-E", $log,
            "-o", "BatchMode=no",
            "-o", "NumberOfPasswordPrompts=1",
            "-o", "PreferredAuthentications=password",
            "-o", "PubkeyAuthentication=no",
            "-o", "ExitOnForwardFailure=yes",
            "-o", "ServerAliveInterval=20",
            "-o", "ServerAliveCountMax=3",
            "-o", "StrictHostKeyChecking=accept-new",
            "-R", "0:localhost:3389",
            "$($env:SUZLAB_TUNNEL_USER)@tnl.suzlab.com"
          )

          $process = Start-Process `
            -FilePath "ssh.exe" `
            -ArgumentList $sshArgs `
            -PassThru `
            -NoNewWindow

          "SUZLAB_SSH_PID=$($process.Id)" >> $env:GITHUB_ENV

          $allocatedPort = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $process.Refresh()

            if ($process.HasExited) {
              if (Test-Path $log) {
                Get-Content $log -Tail 40
              }

              throw "SSH connection failed."
            }

            $content = Get-Content $log -Raw -ErrorAction SilentlyContinue

            if ($content -match 'Allocated port (\d+) for remote forward') {
              $allocatedPort = $Matches[1]
              break
            }
          }

          if (-not $allocatedPort) {
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            throw "SuzLab did not return an allocated port."
          }

          "SUZLAB_ENDPOINT_PORT=$allocatedPort" >> $env:GITHUB_ENV

          "## SuzLab Tunnel" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Field | Value |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Host | tnl.suzlab.com |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| Port | $allocatedPort |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| RDP | localhost:3389 |" | Out-File $env:GITHUB_STEP_SUMMARY -Append

          Write-Host "======================================"
          Write-Host "SUZLAB TUNNEL CONNECTED"
          Write-Host "Endpoint: tnl.suzlab.com:$allocatedPort"
          Write-Host "======================================"

      # ==========================================
      # 07 - MAINTAIN SESSION
      # ==========================================

      - name: "07 - Maintain SuzLab Tunnel"
        shell: pwsh
        run: |
          $minutes = switch ("${{ inputs.duration }}") {
            "1h"    { 60 }
            "3h"    { 180 }
            "5h40m" { 340 }
            default { throw "Invalid duration." }
          }

          $end = (Get-Date).AddMinutes($minutes)
          $log = "$env:RUNNER_TEMP\suzlab-ssh.log"

          Write-Host "Endpoint: tnl.suzlab.com:$env:SUZLAB_ENDPOINT_PORT"

          while ((Get-Date) -lt $end) {
            $process = Get-Process `
              -Id $env:SUZLAB_SSH_PID `
              -ErrorAction SilentlyContinue

            if (-not $process) {
              Write-Host "[ERROR] SSH process stopped."

              if (Test-Path $log) {
                Get-Content $log -Tail 40
              }

              throw "SuzLab SSH tunnel disconnected."
            }

            $remaining = $end - (Get-Date)

            Write-Host "[$(Get-Date -Format HH:mm:ss)] Tunnel active | $([int]$remaining.TotalMinutes) minutes remaining"

            Start-Sleep -Seconds 10
          }

          Write-Host "[SuzLab] Session expired."

      # ==========================================
      # 08 - CLEANUP
      # ==========================================

      - name: "08 - Cleanup SuzLab Session"
        if: always()
        shell: pwsh
        run: |
          Write-Host "[SuzLab] Cleaning up..."

          if ($env:SUZLAB_SSH_PID) {
            Stop-Process `
              -Id $env:SUZLAB_SSH_PID `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Disable-LocalUser `
            -Name "SUZLAB-DEMO" `
            -ErrorAction SilentlyContinue

          Remove-Item "$env:RUNNER_TEMP\suzlab-askpass.cmd" `
            -Force -ErrorAction SilentlyContinue

          Write-Host "[SuzLab] Cleanup completed."

      # ==========================================
      # 09 - DEBUG LOG
      # ==========================================

      - name: "09 - Upload SSH Diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suzlab-tunnel-diagnostics
          path: ${{ runner.temp }}/suzlab-ssh.log
          if-no-files-found: ignore
          retention-days: 1
