name: "SuzLab Tunnel - RDP Demo"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "SuzLab Tunnel Session Duration"
        required: true
        default: "3h"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

permissions:
  contents: read

jobs:
  suzlab-demo:
    name: "SuzLab SSH Reverse Tunnel"
    runs-on: windows-latest
    timeout-minutes: 345

    env:
      TUNNEL_HOST: tnl.suzlab.com
      TUNNEL_PORT: "2222"
      RDP_PORT: "3389"

    steps:
      # ==========================================
      # 01 - WELCOME
      # ==========================================
      - name: "01 - SuzLab Welcome"
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "     SUZLAB TUNNEL - RDP SERVICE"
          Write-Host "======================================"
          Write-Host "Host: $env:TUNNEL_HOST`:$env:TUNNEL_PORT | Duration: ${{ inputs.duration }}"

      # ==========================================
      # 02 - WINDOWS RDP (TỐI ƯU TCP & CHỐNG SLEEP)
      # ==========================================
      - name: "02 - Configure Windows RDP"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tsPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $rdpTcpPath = "$tsPath\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $tsPath -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path $rdpTcpPath -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path $rdpTcpPath -Name "SecurityLayer" -Value 2

          # Ép RDP chạy thuần TCP (1 = TCP only) để không bị đứng hình qua SSH Tunnel
          New-ItemProperty -Path $rdpTcpPath -Name "SelectTransport" -Value 1 -PropertyType DWord -Force | Out-Null

          # Tắt chế độ ngủ của Windows trong phiên dài
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          if ((Get-Service TermService).Status -ne "Running") {
            throw "RDP service failed to start."
          }

          Write-Host "[OK] Windows RDP ready (TCP-optimized)."

      # ==========================================
      # 03 - RDP ACCOUNT
      # ==========================================
      - name: "03 - Create SuzLab Demo Account"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower = "abcdefghijkmnpqrstuvwxyz"
          $digits = "23456789"
          $all = $upper + $lower + $digits

          $chars = @(
            $upper[(Get-Random -Maximum $upper.Length)],
            $lower[(Get-Random -Maximum $lower.Length)],
            $digits[(Get-Random -Maximum $digits.Length)]
          )
          for ($i = 0; $i -lt 15; $i++) {
            $chars += $all[(Get-Random -Maximum $all.Length)]
          }
          $password = -join ($chars | Sort-Object { Get-Random })
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "SUZLAB-DEMO" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "SUZLAB-DEMO"
          }

          New-LocalUser `
            -Name "SUZLAB-DEMO" `
            -Password $secure `
            -Description "SuzLab Tunnel Demo" `
            -AccountNeverExpires | Out-Null

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "SUZLAB-DEMO"

          @(
            "## SuzLab RDP Account"
            "| Field | Value |"
            "|---|---|"
            "| Username | ``SUZLAB-DEMO`` |"
            "| Password | ``$password`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "[OK] Demo account created."

      # ==========================================
      # 04 - OPENSSH
      # ==========================================
      - name: "04 - Verify OpenSSH"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command ssh.exe -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null
          }

          if (-not (Get-Command ssh.exe -ErrorAction SilentlyContinue)) {
            throw "OpenSSH installation failed."
          }

          Write-Host "[OK] OpenSSH ready."

      # ==========================================
      # 05 - SSH ASKPASS
      # ==========================================
      - name: "05 - Prepare SuzLab Authentication"
        shell: pwsh
        env:
          SUZLAB_TUNNEL_USER: ${{ secrets.SUZLAB_TUNNEL_USER }}
          SUZLAB_TUNNEL_PASSWORD: ${{ secrets.SUZLAB_TUNNEL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SUZLAB_TUNNEL_USER) -or [string]::IsNullOrWhiteSpace($env:SUZLAB_TUNNEL_PASSWORD)) {
            throw "Missing SUZLAB_TUNNEL_USER or SUZLAB_TUNNEL_PASSWORD secrets."
          }

          $askpass = "$env:RUNNER_TEMP\suzlab-askpass.cmd"
          @(
            '@echo off'
            'setlocal EnableDelayedExpansion'
            'echo !SUZLAB_TUNNEL_PASSWORD!'
          ) | Set-Content -Path $askpass -Encoding ASCII

          "SUZLAB_ASKPASS=$askpass" >> $env:GITHUB_ENV
          Write-Host "[OK] Authentication helper prepared."

      # ==========================================
      # 06 - CONNECT & MAINTAIN TUNNEL (CHUNG 1 STEP)
      # ==========================================
      - name: "06 - Connect & Maintain SuzLab Tunnel"
        shell: pwsh
        env:
          SUZLAB_TUNNEL_USER: ${{ secrets.SUZLAB_TUNNEL_USER }}
          SUZLAB_TUNNEL_PASSWORD: ${{ secrets.SUZLAB_TUNNEL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $minutes = switch ("${{ inputs.duration }}") {
            "1h"    { 60 }
            "3h"    { 180 }
            "5h40m" { 340 }
            default { throw "Invalid duration." }
          }

          function Read-LogSafe {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return "" }
            $fs = $null
            $sr = $null
            try {
              $fs = [System.IO.File]::Open($Path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              $sr = New-Object System.IO.StreamReader($fs)
              return $sr.ReadToEnd()
            } catch {
              return ""
            } finally {
              if ($sr) { $sr.Dispose() }
              if ($fs) { $fs.Dispose() }
            }
          }

          $errLog = "$env:RUNNER_TEMP\suzlab-ssh-err.log"
          $outLog = "$env:RUNNER_TEMP\suzlab-ssh-out.log"
          $emptyIn = "$env:RUNNER_TEMP\suzlab-empty.in"
          New-Item -Path $emptyIn -ItemType File -Force | Out-Null

          $env:SSH_ASKPASS = $env:SUZLAB_ASKPASS
          $env:SSH_ASKPASS_REQUIRE = "force"
          $env:DISPLAY = "suzlab:0"

          $sshArgs = @(
            "-v",
            "-p", $env:TUNNEL_PORT,
            "-N",
            "-T",
            "-o", "BatchMode=no",
            "-o", "NumberOfPasswordPrompts=1",
            "-o", "PreferredAuthentications=password,keyboard-interactive",
            "-o", "PubkeyAuthentication=no",
            "-o", "ExitOnForwardFailure=yes",
            "-o", "TCPKeepAlive=yes",
            "-o", "ServerAliveInterval=15",
            "-o", "ServerAliveCountMax=3",
            "-o", "Compression=no",
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-R", "0:localhost:$($env:RDP_PORT)",
            "$($env:SUZLAB_TUNNEL_USER)@$($env:TUNNEL_HOST)"
          )

          function Start-SuzLabTunnel {
            Remove-Item $errLog, $outLog -Force -ErrorAction SilentlyContinue

            $proc = Start-Process `
              -FilePath "ssh.exe" `
              -ArgumentList $sshArgs `
              -RedirectStandardInput $emptyIn `
              -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog `
              -WindowStyle Hidden `
              -PassThru

            $resolvedEndpoint = $null
            $forwardOk = $false

            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()

              $combined = (Read-LogSafe $errLog) + "`n" + (Read-LogSafe $outLog)

              if ($proc.HasExited) {
                Write-Host "[ERROR] SSH exited with code $($proc.ExitCode)"
                Write-Host $combined
                return $null
              }

              if ($combined -match 'Allocated port (\d+) for remote forward' -and $Matches[1] -ne $env:TUNNEL_PORT) {
                $resolvedEndpoint = "$($env:TUNNEL_HOST):$($Matches[1])"
                break
              }

              if ($combined -match 'tnl\.suzlab\.com:(\d+)' -and $Matches[1] -ne $env:TUNNEL_PORT) {
                $resolvedEndpoint = "$($env:TUNNEL_HOST):$($Matches[1])"
                break
              }

              if ($combined -match 'remote forward success') {
                $forwardOk = $true
              }

              if ($forwardOk -and $i -ge 2) {
                $resolvedEndpoint = "$($env:TUNNEL_HOST) (dùng port trên dashboard SuzLab)"
                break
              }
            }

            if (-not $resolvedEndpoint) {
              Write-Host "[ERROR] Timeout waiting for tunnel. Logs:"
              Write-Host ((Read-LogSafe $errLog) + "`n" + (Read-LogSafe $outLog))
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              return $null
            }

            return @{
              Process  = $proc
              Endpoint = $resolvedEndpoint
            }
          }

          $session = Start-SuzLabTunnel
          if (-not $session) {
            throw "Initial SuzLab SSH tunnel connection failed."
          }

          $process = $session.Process
          $endpoint = $session.Endpoint

          @(
            "## SuzLab Tunnel Endpoint"
            "| Field | Value |"
            "|---|---|"
            "| Address | ``$endpoint`` |"
            "| Target | ``localhost:$($env:RDP_PORT)`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "======================================"
          Write-Host "SUZLAB TUNNEL CONNECTED"
          Write-Host "Endpoint: $endpoint"
          Write-Host "======================================"

          $end = (Get-Date).AddMinutes($minutes)

          try {
            while ((Get-Date) -lt $end) {
              $process.Refresh()

              if ($process.HasExited) {
                Write-Host "[WARN] SSH tunnel dropped (exit code $($process.ExitCode)). Reconnecting in 3s..."
                Start-Sleep -Seconds 3

                $retry = Start-SuzLabTunnel
                if (-not $retry) {
                  throw "Failed to reconnect SuzLab SSH tunnel."
                }
                $process = $retry.Process
                Write-Host "[OK] Reconnected: $($retry.Endpoint)"
              }

              $remaining = [int]($end - (Get-Date)).TotalMinutes
              Write-Host "[$(Get-Date -Format HH:mm:ss)] Tunnel active | $remaining min remaining"

              Start-Sleep -Seconds 30
            }

            Write-Host "[SuzLab] Session expired."
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      # ==========================================
      # 07 - CLEANUP
      # ==========================================
      - name: "07 - Cleanup SuzLab Session"
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Disable-LocalUser -Name "SUZLAB-DEMO" -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP\suzlab-askpass.cmd", "$env:RUNNER_TEMP\suzlab-empty.in" -Force -ErrorAction SilentlyContinue
          Write-Host "[SuzLab] Cleanup completed."

      # ==========================================
      # 08 - DEBUG LOG (CHỈ UPLOAD KHI LỖI)
      # ==========================================
      - name: "08 - Upload SSH Diagnostics"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suzlab-tunnel-diagnostics
          path: |
            ${{ runner.temp }}/suzlab-ssh-err.log
            ${{ runner.temp }}/suzlab-ssh-out.log
          if-no-files-found: ignore
          retention-days: 1
