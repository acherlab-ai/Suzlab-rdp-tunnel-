name: "SuzLab Tunnel - RDP Demo"

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "SuzLab Tunnel Session Duration"
        required: true
        default: "3h"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

permissions:
  contents: read

jobs:
  suzlab-demo:
    name: "SuzLab Windows RDP"
    runs-on: windows-latest
    timeout-minutes: 345

    env:
      TUNNEL_HOST: tnl.suzlab.com
      TUNNEL_PORT: "2222"
      RDP_PORT: "3389"
      RDP_USER: "SUZLAB-DEMO"

    steps:
      # ==========================================
      # 01 - BẬT RDP & TẠO USER ĐĂNG NHẬP
      # ==========================================
      - name: "01 - Enable RDP & Create User"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Cấu hình Registry RDP (tắt NLA, chỉ dùng TCP)
          $ts = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $ts -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path $tcp -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path $tcp -Name "SecurityLayer" -Value 1
          New-ItemProperty -Path $tcp -Name "SelectTransport" -Value 1 -PropertyType DWord -Force | Out-Null

          # Chống sleep máy ảo
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0

          # Mở Firewall & khởi động dịch vụ RDP
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "SuzLab-RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Set-Service TermService -StartupType Automatic
          Set-Service UmRdpService -StartupType Automatic
          Start-Service TermService, UmRdpService

          # Tạo mật khẩu ngẫu nhiên mạnh
          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower = "abcdefghijkmnpqrstuvwxyz"
          $digits = "23456789"
          $all = $upper + $lower + $digits
          $chars = @(
            $upper[(Get-Random -Maximum $upper.Length)],
            $lower[(Get-Random -Maximum $lower.Length)],
            $digits[(Get-Random -Maximum $digits.Length)],
            "@"
          )
          for ($i = 0; $i -lt 12; $i++) {
            $chars += $all[(Get-Random -Maximum $all.Length)]
          }
          $password = -join ($chars | Sort-Object { Get-Random })
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:RDP_USER
          }

          New-LocalUser -Name $env:RDP_USER -Password $secure -Description "SuzLab RDP" -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

          # Ghi ra Summary & in thẳng ra Log để copy trên điện thoại
          @(
            "## Thong tin ket noi RDP"
            "| Muc | Gia tri |"
            "|---|---|"
            "| Username | ``$($env:RDP_USER)`` |"
            "| Password | ``$password`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "=========================================="
          Write-Host "  RDP DA SAN SANG"
          Write-Host "  Username : $($env:RDP_USER)"
          Write-Host "  Password : $password"
          Write-Host "=========================================="

      # ==========================================
      # 02 - CHUẨN BỊ SSH & MẬT KHẨU TUNNEL
      # ==========================================
      - name: "02 - Prepare SSH Tunnel"
        shell: pwsh
        env:
          SUZLAB_TUNNEL_USER: ${{ secrets.SUZLAB_TUNNEL_USER }}
          SUZLAB_TUNNEL_PASSWORD: ${{ secrets.SUZLAB_TUNNEL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command ssh.exe -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 | Out-Null
          }

          if ([string]::IsNullOrWhiteSpace($env:SUZLAB_TUNNEL_USER) -or [string]::IsNullOrWhiteSpace($env:SUZLAB_TUNNEL_PASSWORD)) {
            throw "Thieu secret SUZLAB_TUNNEL_USER hoac SUZLAB_TUNNEL_PASSWORD."
          }

          $askpass = "$env:RUNNER_TEMP\suzlab-askpass.cmd"
          @(
            '@echo off'
            'setlocal EnableDelayedExpansion'
            'echo !SUZLAB_TUNNEL_PASSWORD!'
          ) | Set-Content -Path $askpass -Encoding ASCII

          "SUZLAB_ASKPASS=$askpass" >> $env:GITHUB_ENV
          Write-Host "[OK] SSH Tunnel ready."

      # ==========================================
      # 03 - KẾT NỐI & GIỮ TUNNEL SUZLAB
      # ==========================================
      - name: "03 - Connect & Maintain SuzLab Tunnel"
        shell: pwsh
        env:
          SUZLAB_TUNNEL_USER: ${{ secrets.SUZLAB_TUNNEL_USER }}
          SUZLAB_TUNNEL_PASSWORD: ${{ secrets.SUZLAB_TUNNEL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $minutes = switch ("${{ inputs.duration }}") {
            "1h"    { 60 }
            "3h"    { 180 }
            "5h40m" { 340 }
            default { throw "Invalid duration." }
          }

          function Read-LogSafe {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return "" }
            $fs = $null; $sr = $null
            try {
              $fs = [System.IO.File]::Open($Path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              $sr = New-Object System.IO.StreamReader($fs)
              return $sr.ReadToEnd()
            } catch { return "" }
            finally {
              if ($sr) { $sr.Dispose() }
              if ($fs) { $fs.Dispose() }
            }
          }

          $errLog = "$env:RUNNER_TEMP\suzlab-ssh-err.log"
          $outLog = "$env:RUNNER_TEMP\suzlab-ssh-out.log"
          $emptyIn = "$env:RUNNER_TEMP\suzlab-empty.in"
          New-Item -Path $emptyIn -ItemType File -Force | Out-Null

          $env:SSH_ASKPASS = $env:SUZLAB_ASKPASS
          $env:SSH_ASKPASS_REQUIRE = "force"
          $env:DISPLAY = "suzlab:0"

          $sshArgs = @(
            "-v",
            "-p", $env:TUNNEL_PORT,
            "-N", "-T",
            "-o", "BatchMode=no",
            "-o", "NumberOfPasswordPrompts=1",
            "-o", "PreferredAuthentications=password,keyboard-interactive",
            "-o", "PubkeyAuthentication=no",
            "-o", "ExitOnForwardFailure=yes",
            "-o", "TCPKeepAlive=yes",
            "-o", "ServerAliveInterval=15",
            "-o", "ServerAliveCountMax=3",
            "-o", "Compression=no",
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-R", "0:localhost:$($env:RDP_PORT)",
            "$($env:SUZLAB_TUNNEL_USER)@$($env:TUNNEL_HOST)"
          )

          function Start-Tunnel {
            Remove-Item $errLog, $outLog -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath "ssh.exe" -ArgumentList $sshArgs `
              -RedirectStandardInput $emptyIn -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog -WindowStyle Hidden -PassThru

            $endpoint = $null
            $forwardOk = $false

            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              $combined = (Read-LogSafe $errLog) + "`n" + (Read-LogSafe $outLog)

              if ($proc.HasExited) {
                Write-Host $combined
                return $null
              }
              if ($combined -match 'Allocated port (\d+) for remote forward' -and $Matches[1] -ne $env:TUNNEL_PORT) {
                $endpoint = "$($env:TUNNEL_HOST):$($Matches[1])"; break
              }
              if ($combined -match 'tnl\.suzlab\.com:(\d+)' -and $Matches[1] -ne $env:TUNNEL_PORT) {
                $endpoint = "$($env:TUNNEL_HOST):$($Matches[1])"; break
              }
              if ($combined -match 'remote forward success') { $forwardOk = $true }
              if ($forwardOk -and $i -ge 2) {
                $endpoint = "$($env:TUNNEL_HOST):31000 (hoac xem port tren dashboard)"
                break
              }
            }

            if (-not $endpoint) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              return $null
            }
            return @{ Process = $proc; Endpoint = $endpoint }
          }

          $session = Start-Tunnel
          if (-not $session) { throw "Ket noi SSH Tunnel that bai." }

          $process = $session.Process
          Write-Host "=========================================="
          Write-Host "  TUNNEL DA THONG: $($session.Endpoint)"
          Write-Host "=========================================="

          $end = (Get-Date).AddMinutes($minutes)
          try {
            while ((Get-Date) -lt $end) {
              $process.Refresh()
              if ($process.HasExited) {
                Write-Host "[WARN] Mat ket noi tunnel, dang ket noi lai..."
                Start-Sleep -Seconds 3
                $retry = Start-Tunnel
                if (-not $retry) { throw "Khong the ket noi lai tunnel." }
                $process = $retry.Process
              }
              $remaining = [int]($end - (Get-Date)).TotalMinutes
              Write-Host "[$(Get-Date -Format HH:mm:ss)] RDP & Tunnel hoat dong | Con lai $remaining phut"
              Start-Sleep -Seconds 30
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      # ==========================================
      # 04 - DỌN DẸP
      # ==========================================
      - name: "04 - Cleanup"
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Disable-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP\suzlab-askpass.cmd", "$env:RUNNER_TEMP\suzlab-empty.in" -Force -ErrorAction SilentlyContinue
